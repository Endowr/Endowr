<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endowr</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14263D;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Times New Roman', Times, Georgia, serif;
  }
  .wrap {
    text-align: center;
    padding: 0 20px;
  }
  h1 {
    color: #FFFFFF;
    font-size: clamp(48px, 10vw, 96px);
    letter-spacing: 3px;
    font-weight: 400;
    margin: 0;
  }
  hr {
    width: 140px;
    border: none;
    border-top: 1px solid #FFFFFF;
    margin: 24px auto;
  }
  p {
    color: #D8DEE8;
    font-size: clamp(14px, 2vw, 18px);
    letter-spacing: 1px;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Endowr</h1>
    <hr>
    <p>Something new is on its way.</p>
  </div>
</body>
</html>
